name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Code validation (Lint)
        run: npm run lint

      - name: Run unit test suite
        run: npm test -- --run

      - name: Production build & Typecheck
        run: npm run build

      - name: Notificar a Discord (#ci-cd)
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_CI }}
          status: ${{ job.status }}
          title: "CI Pipeline: ${{ github.repository }}"
          description: "Resultado de Lint, Test & Build en `${{ github.ref_name }}`"
          nodetail: false
